name: CI

# "CI gruen" ist Release-Bedingung (Serien-Handbuch §1.4).
# Zwei Jobs:
#   1. lint-content  — GDScript-Lint + Content-JSON-Validierung. Braucht kein
#                      Godot, laeuft in dieser Cloud-Umgebung lokal identisch.
#   2. godot         — laedt Godot headless, importiert das Projekt und faehrt
#                      den Headless-Test-Runner (Determinismus, Engine, Interpreter).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Neuer Push auf denselben Ref bricht laufende Runs ab (spart Minuten,
# verhindert dass ein haengender Run blockiert).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Godot-Version zentral. MENSCH-TODO: gegen die lokal gepinnte stable-Version
# abgleichen (ADR-0001).
env:
  GODOT_VERSION: "4.5"

jobs:
  lint-content:
    name: Lint & Content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Werkzeuge installieren
        run: pip install "gdtoolkit==4.*" "jsonschema>=4"

      - name: GDScript-Lint (gdlint)
        run: |
          files=$(git ls-files '*.gd')
          if [ -n "$files" ]; then gdlint $files; else echo "keine .gd-Dateien"; fi

      - name: GDScript-Format-Check (gdformat)
        run: |
          files=$(git ls-files '*.gd')
          if [ -n "$files" ]; then gdformat --check $files; else echo "keine .gd-Dateien"; fi

      - name: Content-JSON validieren
        run: python3 tools/validate_content.py

  godot:
    name: Godot headless
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Godot ${{ env.GODOT_VERSION }} holen
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          ZIP="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fSL -o godot.zip "${BASE}/${ZIP}"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Projekt importieren (Ladecheck)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          godot --headless --import 2>&1 | tee import.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Failed to load" import.log; then
            echo "::error::Godot meldete Script-/Ladefehler beim Import"
            exit 1
          fi

      - name: Headless-Tests
        timeout-minutes: 5
        run: |
          set -uo pipefail
          if [ ! -f tests/run_tests.gd ]; then
            echo "Noch kein Test-Runner."
            exit 0
          fi
          # --quit-after erzwingt Beenden, falls der SceneTree-Runner nicht
          # selbst quittet (Absicherung gegen Idle-Hang). Bewertung ueber das
          # Erfolgs-Sentinel im Log, nicht ueber den Exit-Code.
          godot --headless --quit-after 5000 --script res://tests/run_tests.gd 2>&1 | tee tests.log || true
          echo "---------------------------------"
          if grep -Eiq "SCRIPT ERROR|Parse Error" tests.log; then
            echo "::error::Laufzeit-/Script-Fehler in den Tests"
            exit 1
          fi
          if grep -q "ALLE .* TESTS GRUEN" tests.log; then
            echo "Headless-Tests grün."
            exit 0
          fi
          echo "::error::Erfolgs-Sentinel fehlt — Tests nicht grün oder Runner lief nicht als MainLoop"
          exit 1
